<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a0a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>🌸 Trợ Lý Dinh Dưỡng Mẹ Bầu</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #f8a5c2;
      --gold: #fdcb6e;
      --purple: #a29bfe;
      --bg: #1a0a2e;
      --bg2: #2d1b4e;
      --text: #f0e6ff;
      --text-dim: rgba(240,230,255,0.5);
      --text-faint: rgba(240,230,255,0.25);
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(160deg, #1a0a2e 0%, #2d1b4e 50%, #1a2a1a 100%);
      background-attachment: fixed;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    /* Orbs */
    .orb {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    }
    .orb1 { top: -15%; left: -15%; width: 70vw; height: 70vw; background: radial-gradient(circle, rgba(248,165,194,0.07) 0%, transparent 70%); }
    .orb2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(162,155,254,0.07) 0%, transparent 70%); }

    .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 16px 40px; }

    /* Header */
    .header { text-align: center; padding: 44px 0 28px; }
    .header-icon { font-size: 52px; display: block; margin-bottom: 10px; filter: drop-shadow(0 0 24px rgba(248,165,194,0.6)); animation: float 3s ease-in-out infinite; }
    .header h1 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--pink), var(--gold), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.3; }
    .header p { margin-top: 6px; color: var(--text-dim); font-size: 12px; letter-spacing: 0.5px; }

    /* Trimester tabs */
    .section-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
    .trimesters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-bottom: 16px; }
    .trimesters::-webkit-scrollbar { display: none; }
    .tri-btn {
      flex-shrink: 0; padding: 8px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--card); color: var(--text-dim); font-family: 'DM Sans', sans-serif;
      font-size: 12px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .tri-btn.active {
      background: rgba(248,165,194,0.2); border-color: var(--pink); color: var(--pink);
      box-shadow: 0 0 16px rgba(248,165,194,0.25);
    }

    /* Search */
    .search-wrap {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.07); border: 1.5px solid rgba(248,165,194,0.2);
      border-radius: 16px; padding: 4px 4px 4px 14px;
      box-shadow: 0 4px 24px rgba(248,165,194,0.08);
      backdrop-filter: blur(12px); margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .search-wrap:focus-within { border-color: rgba(248,165,194,0.5); }
    .search-icon { font-size: 18px; flex-shrink: 0; }
    .search-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 10px 0;
    }
    .search-input::placeholder { color: var(--text-faint); }
    .search-btn {
      flex-shrink: 0; padding: 10px 18px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; box-shadow: 0 3px 14px rgba(248,165,194,0.35);
      transition: all 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .search-btn:active { transform: scale(0.96); }
    .search-btn:disabled { background: rgba(162,155,254,0.3); box-shadow: none; cursor: not-allowed; }

    /* Quick chips */
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
    .chip {
      padding: 6px 12px; border-radius: 14px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 12px; cursor: pointer;
      transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .chip:active { background: rgba(248,165,194,0.12); border-color: rgba(248,165,194,0.3); color: var(--pink); }

    /* Result card */
    .result-card {
      border-radius: 20px; overflow: hidden;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 24px;
    }
    .result-header {
      padding: 18px 20px; display: flex; align-items: center;
      justify-content: space-between; gap: 12; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .result-food-info { display: flex; align-items: center; gap: 12; }
    .result-food-icon { font-size: 32px; }
    .result-food-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
    .result-food-name { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--text); }
    .risk-badge {
      flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    }
    .result-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
    .result-summary {
      font-family: 'Playfair Display', serif; font-size: 15px; font-style: italic;
      line-height: 1.6; opacity: 0.9;
    }
    .info-block { border-radius: 12px; padding: 12px 14px; }
    .info-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px; opacity: 0.5; }
    .info-text { font-size: 13px; line-height: 1.7; color: rgba(240,230,255,0.82); }
    .disclaimer { font-size: 10px; color: var(--text-faint); text-align: right; padding-top: 4px; }

    /* Loading */
    .loading-card {
      background: rgba(162,155,254,0.08); border: 1px solid rgba(162,155,254,0.2);
      border-radius: 20px; padding: 32px; text-align: center; margin-bottom: 24px;
      animation: slideUp 0.3s ease;
    }
    .loading-spinner { font-size: 36px; display: block; animation: spin 1.5s linear infinite; margin-bottom: 12px; }
    .loading-text { color: var(--text-dim); font-size: 14px; }
    .loading-text strong { color: var(--purple); }

    /* History */
    .history-section { margin-top: 4px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .clear-btn { background: none; border: none; color: var(--text-faint); font-size: 11px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .history-item {
      display: flex; align-items: center; gap: 10; padding: 11px 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 8px; cursor: pointer;
      transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .history-item:active { background: rgba(248,165,194,0.06); border-color: rgba(248,165,194,0.2); }
    .history-icon { font-size: 20px; flex-shrink: 0; margin-right: 8px; }
    .history-info { flex: 1; }
    .history-name { font-size: 14px; font-weight: 500; color: var(--text); }
    .history-summary { font-size: 11px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .history-badge { flex-shrink: 0; padding: 3px 9px; border-radius: 10px; font-size: 10px; font-weight: 700; }

    /* Risk color themes */
    .risk-safe     { --rc: #6fcf97; --rb: #e8faf0; --rt: #1a7a4a; }
    .risk-caution  { --rc: #f7b731; --rb: #fffbe6; --rt: #7d5a00; }
    .risk-harmful  { --rc: #f0932b; --rb: #fff0e8; --rt: #7a3300; }
    .risk-danger   { --rc: #e74c3c; --rb: #fde8e8; --rt: #7a0000; }

    /* Animations */
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="app">
    <!-- Header -->
    <div class="header">
      <span class="header-icon">🌸</span>
      <h1>Trợ Lý Dinh Dưỡng<br>Mẹ Bầu</h1>
      <p>Tra cứu thực phẩm · Nhận lời khuyên từ AI</p>
    </div>

    <!-- Trimester -->
    <div class="section-label">Giai đoạn thai kỳ</div>
    <div class="trimesters" id="trimesters">
      <button class="tri-btn active" data-val="all">🌿 Tất cả</button>
      <button class="tri-btn" data-val="1">🌱 Tam cá nguyệt 1</button>
      <button class="tri-btn" data-val="2">🌸 Tam cá nguyệt 2</button>
      <button class="tri-btn" data-val="3">🌷 Tam cá nguyệt 3</button>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <span class="search-icon">🍽️</span>
      <input class="search-input" id="searchInput" type="text"
        placeholder="Nhập tên thực phẩm... (vd: dứa, cà phê)"
        autocomplete="off" autocorrect="off" spellcheck="false" />
      <button class="search-btn" id="searchBtn" onclick="analyze()">Phân tích</button>
    </div>

    <!-- Quick chips -->
    <div class="chips" id="chips"></div>

    <!-- Result -->
    <div id="resultArea"></div>

    <!-- History -->
    <div class="history-section" id="historySection" style="display:none">
      <div class="history-header">
        <div class="section-label" style="margin:0">🕐 Lịch sử tra cứu</div>
        <button class="clear-btn" onclick="clearHistory()">Xóa tất cả</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────
    // ⚠️ QUAN TRỌNG: Dán Anthropic API key của bạn vào đây
    // Lấy tại: https://console.anthropic.com/
    const API_KEY = "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";
    // ────────────────────────────────────────────────────────

    const QUICK = ["🍍 Dứa","🐟 Cá sống","☕ Cà phê","🥚 Trứng sống","🍺 Rượu bia","🧀 Phô mai","🫀 Gan bò","🍵 Trà thảo mộc","🍣 Sushi","🥬 Rau ngót","🌶️ Ớt","🍇 Nho khô"];
    const TRIMESTER_LABELS = { all: "Tất cả", "1": "Tam cá nguyệt 1 (Tuần 1–12)", "2": "Tam cá nguyệt 2 (Tuần 13–26)", "3": "Tam cá nguyệt 3 (Tuần 27–40)" };
    const RISK_CLASS = { "AN TOÀN": "risk-safe", "THẬN TRỌNG": "risk-caution", "CÓ HẠI": "risk-harmful", "NGUY HIỂM": "risk-danger" };
    const RISK_ICON = { "AN TOÀN": "✅", "THẬN TRỌNG": "⚠️", "CÓ HẠI": "🚫", "NGUY HIỂM": "☠️" };

    let activeTrimester = "all";
    let history = [];
    try { history = JSON.parse(localStorage.getItem("mebau_history") || "[]"); } catch {}

    // Init chips
    const chipsEl = document.getElementById("chips");
    QUICK.forEach(s => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = s;
      b.onclick = () => { document.getElementById("searchInput").value = s.slice(2); analyze(); };
      chipsEl.appendChild(b);
    });

    // Trimester tabs
    document.getElementById("trimesters").addEventListener("click", e => {
      const btn = e.target.closest(".tri-btn");
      if (!btn) return;
      document.querySelectorAll(".tri-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeTrimester = btn.dataset.val;
    });

    // Enter key
    document.getElementById("searchInput").addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); analyze(); }
    });

    async function analyze(foodOverride) {
      const input = document.getElementById("searchInput");
      const food = (foodOverride || input.value).trim();
      if (!food) { input.focus(); return; }

      const btn = document.getElementById("searchBtn");
      btn.disabled = true; btn.textContent = "⏳ Đang phân tích...";

      // Show loader
      document.getElementById("resultArea").innerHTML = `
        <div class="loading-card">
          <span class="loading-spinner">🔍</span>
          <div class="loading-text">Đang phân tích <strong>${food}</strong>...</div>
        </div>`;

      const trimNote = activeTrimester === "all" ? "Không rõ giai đoạn thai kỳ." : `Mẹ đang ở ${TRIMESTER_LABELS[activeTrimester]}.`;

      if (!API_KEY || API_KEY === "YOUR_API_KEY_HERE") {
        showError("⚙️ Chưa có API key", "Mở file index.html, tìm dòng <code>const API_KEY = ...</code> và dán API key của bạn vào.");
        btn.disabled = false; btn.textContent = "Phân tích"; return;
      }

      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": API_KEY,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            system: `Bạn là chuyên gia dinh dưỡng cho mẹ bầu người Việt Nam. Khi được hỏi về một thực phẩm, hãy trả lời ĐÚNG định dạng JSON sau và KHÔNG có gì khác:
{"risk":"AN TOÀN","emoji":"1 emoji phù hợp với thực phẩm","summary":"1 câu tóm tắt ngắn gọn dưới 20 từ","details":"Giải thích chi tiết 2-3 câu về lý do","advice":"Lời khuyên cụ thể cho mẹ bầu 2-3 câu","alternative":"Gợi ý thay thế an toàn nếu có hại hoặc null","trimester_note":"Lưu ý riêng cho giai đoạn thai kỳ hiện tại hoặc null"}
Các giá trị hợp lệ cho risk: AN TOÀN, THẬN TRỌNG, CÓ HẠI, NGUY HIỂM.
Chỉ trả về JSON thuần túy, không markdown, không backtick.`,
            messages: [{ role: "user", content: `Thực phẩm: "${food}". ${trimNote} Đánh giá mức độ an toàn.` }]
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          const msg = errData?.error?.message || `HTTP ${res.status}`;
          if (res.status === 401) showError("🔑 API key không hợp lệ", "Vui lòng kiểm tra lại API key tại console.anthropic.com");
          else if (res.status === 429) showError("⏳ Quá giới hạn request", "Đợi vài giây rồi thử lại.");
          else showError("❌ Lỗi từ server", msg);
          btn.disabled = false; btn.textContent = "Phân tích"; return;
        }

        const data = await res.json();
        const rawText = data.content?.find(b => b.type === "text")?.text || "";
        if (!rawText) { showError("❌ Không có phản hồi", "API trả về rỗng. Thử lại."); btn.disabled = false; btn.textContent = "Phân tích"; return; }

        // Extract JSON robustly
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) { showError("❌ Dữ liệu không hợp lệ", rawText.slice(0, 100)); btn.disabled = false; btn.textContent = "Phân tích"; return; }
        const parsed = JSON.parse(jsonMatch[0]);
        showResult(food, parsed);
        saveHistory(food, parsed);

      } catch (err) {
        if (err.name === "TypeError" && err.message.includes("fetch")) {
          showError("🌐 Lỗi kết nối mạng", "Kiểm tra internet hoặc thử mở trên GitHub Pages thay vì mở file trực tiếp.");
        } else {
          showError("❌ Lỗi không xác định", err.message || String(err));
        }
      }

      btn.disabled = false; btn.textContent = "Phân tích";
    }

    function showError(title, msg) {
      document.getElementById("resultArea").innerHTML = `
        <div style="background:rgba(231,76,60,0.1);border:1.5px solid rgba(231,76,60,0.3);border-radius:16px;padding:20px;margin-bottom:20px;animation:slideUp 0.3s ease">
          <div style="font-size:15px;font-weight:600;color:#e74c3c;margin-bottom:8px">${title}</div>
          <div style="font-size:13px;color:rgba(240,230,255,0.7);line-height:1.6">${msg}</div>
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(231,76,60,0.2);font-size:11px;color:rgba(240,230,255,0.3)">
            💡 Mở file qua GitHub Pages, không mở trực tiếp từ máy tính (file://).
          </div>
        </div>`;
    }

    function showResult(food, d) {
      const rClass = RISK_CLASS[d.risk] || "risk-caution";
      const rIcon = RISK_ICON[d.risk] || "⚠️";

      document.getElementById("resultArea").innerHTML = `
        <div class="result-card ${rClass}" style="
          background: linear-gradient(160deg, rgba(var(--rc-raw,255,255,255),0.06), rgba(var(--rc-raw,255,255,255),0.02));
          border: 1.5px solid color-mix(in srgb, var(--rc,#fff) 35%, transparent);
          box-shadow: 0 8px 40px color-mix(in srgb, var(--rc,#fff) 15%, transparent);
        ">
          <div class="result-header" style="background: color-mix(in srgb, var(--rc,#fff) 8%, transparent)">
            <div class="result-food-info">
              <span class="result-food-icon">${d.emoji || "🍽️"}</span>
              <div>
                <div class="result-food-label">Thực phẩm được phân tích</div>
                <div class="result-food-name">${food}</div>
              </div>
            </div>
            <div class="risk-badge" style="
              background: color-mix(in srgb, var(--rc,#fff) 15%, transparent);
              border: 1.5px solid color-mix(in srgb, var(--rc,#fff) 50%, transparent);
              color: var(--rc, #fff);
            ">${rIcon} ${d.risk}</div>
          </div>
          <div class="result-body">
            ${d.summary ? `<div class="result-summary" style="color: color-mix(in srgb, var(--rc,#f0e6ff) 80%, #f0e6ff)">"${d.summary}"</div>` : ""}
            ${d.details ? `
            <div class="info-block" style="background: rgba(255,255,255,0.04)">
              <div class="info-label">📋 Chi tiết</div>
              <div class="info-text">${d.details}</div>
            </div>` : ""}
            ${d.advice ? `
            <div class="info-block" style="background: rgba(248,165,194,0.06); border: 1px solid rgba(248,165,194,0.15)">
              <div class="info-label">💡 Lời khuyên</div>
              <div class="info-text">${d.advice}</div>
            </div>` : ""}
            ${d.trimester_note ? `
            <div class="info-block" style="background: rgba(162,155,254,0.06); border: 1px solid rgba(162,155,254,0.2)">
              <div class="info-label">🗓️ Lưu ý theo giai đoạn</div>
              <div class="info-text">${d.trimester_note}</div>
            </div>` : ""}
            ${d.alternative ? `
            <div class="info-block" style="background: rgba(111,207,151,0.07); border: 1px solid rgba(111,207,151,0.25)">
              <div class="info-label">🔄 Thay thế an toàn</div>
              <div class="info-text">${d.alternative}</div>
            </div>` : ""}
            <div class="disclaimer">⚕️ Chỉ mang tính tham khảo · Luôn tham vấn bác sĩ sản khoa</div>
          </div>
        </div>`;

      // Set CSS var for color-mix to work
      const card = document.querySelector(".result-card");
      const colors = { "risk-safe":"111,207,151", "risk-caution":"247,183,49", "risk-harmful":"240,147,43", "risk-danger":"231,76,60" };
      if (card && colors[rClass]) card.style.setProperty("--rc-raw", colors[rClass]);
    }

    function saveHistory(food, d) {
      history = [{ food, risk: d.risk, emoji: d.emoji || "🍽️", summary: d.summary }, ...history.filter(h => h.food !== food)].slice(0, 10);
      try { localStorage.setItem("mebau_history", JSON.stringify(history)); } catch {}
      renderHistory();
    }

    function renderHistory() {
      const section = document.getElementById("historySection");
      const list = document.getElementById("historyList");
      if (!history.length) { section.style.display = "none"; return; }
      section.style.display = "block";
      const colors = { "AN TOÀN": "#6fcf97", "THẬN TRỌNG": "#f7b731", "CÓ HẠI": "#f0932b", "NGUY HIỂM": "#e74c3c" };
      const icons = { "AN TOÀN": "✅", "THẬN TRỌNG": "⚠️", "CÓ HẠI": "🚫", "NGUY HIỂM": "☠️" };
      list.innerHTML = history.map(h => `
        <div class="history-item" onclick="document.getElementById('searchInput').value='${h.food}'; analyze()">
          <span class="history-icon">${h.emoji || "🍽️"}</span>
          <div class="history-info">
            <div class="history-name">${h.food}</div>
            ${h.summary ? `<div class="history-summary">${h.summary}</div>` : ""}
          </div>
          <span class="history-badge" style="background:${colors[h.risk] || "#999"}22;color:${colors[h.risk] || "#999"};border:1px solid ${colors[h.risk] || "#999"}44">${icons[h.risk] || "•"} ${h.risk}</span>
        </div>`).join("");
    }

    function clearHistory() {
      history = [];
      try { localStorage.removeItem("mebau_history"); } catch {}
      renderHistory();
    }

    // Init history on load
    renderHistory();
  </script>
</body>
</html>
